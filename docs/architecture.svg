<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">EvoGuardLab — one execution path, three gates before any side effect</text>
  <text x="480" y="56" text-anchor="middle" font-size="12.5" fill="#6b7280">The question this repo answers: when a gate says "deny", does the tool actually stop?</text>

  <!-- Agent -->
  <rect x="30" y="96" width="150" height="86" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="105" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">Agent</text>
  <text x="105" y="144" text-anchor="middle" font-size="11" fill="#4338ca">plan → call tool</text>
  <text x="105" y="162" text-anchor="middle" font-size="11" fill="#4338ca">(goal + args)</text>

  <!-- Ctx.call -->
  <rect x="222" y="80" width="196" height="118" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Ctx.call()</text>
  <text x="320" y="122" text-anchor="middle" font-size="10.5" fill="#4b5563">the ONLY execution entry</text>
  <text x="320" y="140" text-anchor="middle" font-size="10.5" fill="#4b5563">runtime.py</text>
  <text x="320" y="162" text-anchor="middle" font-size="10.5" fill="#b91c1c">no gate → no side effect</text>
  <text x="320" y="180" text-anchor="middle" font-size="10.5" fill="#b91c1c">(verified by call-count tests)</text>

  <!-- Gates -->
  <rect x="460" y="72" width="250" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="585" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">① Structural contract</text>
  <text x="585" y="106" text-anchor="middle" font-size="10" fill="#a16207">identity · resource · domain · amount · strict args</text>

  <rect x="460" y="120" width="250" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="585" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">② Intent alignment</text>
  <text x="585" y="154" text-anchor="middle" font-size="10" fill="#a16207">optional local LLM · no goal → review, never allow</text>

  <rect x="460" y="168" width="250" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="585" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">③ Versioned approval</text>
  <text x="585" y="202" text-anchor="middle" font-size="10" fill="#a16207">atomic one-shot · bound to candidate + idempotency</text>

  <!-- Tool -->
  <rect x="752" y="112" width="176" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="840" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Tool executes</text>
  <text x="840" y="158" text-anchor="middle" font-size="10.5" fill="#166534">exactly once</text>
  <text x="840" y="175" text-anchor="middle" font-size="10.5" fill="#166534">side effect happens</text>

  <!-- blocked -->
  <rect x="752" y="212" width="176" height="66" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="840" y="236" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">Call stopped</text>
  <text x="840" y="254" text-anchor="middle" font-size="10.5" fill="#991b1b">tool calls = 0</text>
  <text x="840" y="270" text-anchor="middle" font-size="10.5" fill="#991b1b">recorded as call_stopped</text>

  <!-- arrows -->
  <line x1="180" y1="139" x2="218" y2="139" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="418" y1="139" x2="456" y2="93" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="585" y1="114" x2="585" y2="118" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="585" y1="162" x2="585" y2="166" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="710" y1="150" x2="748" y2="150" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="729" y="142" text-anchor="middle" font-size="9.5" fill="#15803d">allow</text>

  <path d="M 460 196 C 420 240, 760 250, 750 244" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="560" y="238" text-anchor="middle" font-size="9.5" fill="#dc2626">deny / review</text>

  <!-- output side -->
  <rect x="30" y="300" width="430" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="245" y="324" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Return path: untrusted data, not instructions</text>
  <text x="245" y="344" text-anchor="middle" font-size="10.5" fill="#1d4ed8">invisible-char normalisation → 24 regex detectors → n-gram model → local semantic judge</text>
  <text x="245" y="362" text-anchor="middle" font-size="10.5" fill="#1d4ed8">+ action-scope: a read-only tool must not ask the agent to act</text>
  <text x="245" y="382" text-anchor="middle" font-size="10.5" fill="#1d4ed8">wrap-as-data · encode-by-context · audit trail with six-field contract</text>

  <rect x="498" y="300" width="430" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="713" y="324" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4c1d95">Every decision carries 6 fields</text>
  <text x="713" y="346" text-anchor="middle" font-size="11" fill="#5b21b6">detected · decision · attempted · executed · effect · reason</text>
  <text x="713" y="368" text-anchor="middle" font-size="10.5" fill="#6d28d9">"detection advice" ≠ "actually blocked" — they are counted separately</text>
  <text x="713" y="386" text-anchor="middle" font-size="10.5" fill="#6d28d9">so a report can never claim a block that did not happen</text>

  <!-- bottom honesty -->
  <rect x="30" y="420" width="898" height="76" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="46" y="443" font-size="12" font-weight="700" fill="#92400e">What this is NOT</text>
  <text x="46" y="462" font-size="10.5" fill="#a16207">Not a WAF · not a sandbox · not a content moderator · not a leaderboard entry. Chinese indirect-injection data is self-built, not a public corpus.</text>
  <text x="46" y="480" font-size="10.5" fill="#a16207">The out-of-sample evidence is the English InjecAgent held-out split; every in-sample number is labelled as such in experiments/.</text>
</svg>
