[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoguardlab"
version = "0.6.0"
description = "Reproducible benchmark for AI-agent guardrails: does a deny actually stop the tool call?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EvoGuardLab contributors" }]
keywords = ["ai-agents", "prompt-injection", "guardrails", "agent-security", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
# 刻意**零运行时依赖**：整套评测只用标准库。
# 这是可复现性的一部分 —— 装不上 torch 的机器也能跑出同一批数字。
dependencies = []

[project.optional-dependencies]
# 运行时依赖保持 []；这里只放**开发/CI 用的静态检查工具**。
# pyflakes 必须列进来：gate 的 EG-024/static-names 在没有 pyflakes 时会
# 静默 skip（不计 pass），CI 就会少查一项而无人在意——而这一项抓过 3 处
# 「只在冷路径触发」的未定义名（含流式请求带攻击输入返回 500）。
dev = ["pyflakes>=3.0"]

[project.scripts]
evoguard = "evoguard_cli:main"

[project.urls]
# 真实仓库地址（推送前填好；不写占位 URL，避免死链与冒充上游）。
Homepage = "https://github.com/zs689/EvoGuardLab"
Repository = "https://github.com/zs689/EvoGuardLab"
Issues = "https://github.com/zs689/EvoGuardLab/issues"

[tool.setuptools]
# 根目录放 CLI（py-module），evoguard 包映射到 ai-service/evoguard。
# 不用 packages.find：它会顺手把 package_dir 改成 ai-service，
# 结果根目录的 evoguard_cli.py 找不到（实测 `pip install -e .` 后
# 入口直接 ModuleNotFoundError）。
#
# EG-004：以前只写了 packages = ["evoguard"]，enterprise/ 子包、
# Inspector、前端、配置与演示脚本全都不在 wheel 里，装完只剩一个
# 跑不起来的 CLI。这里显式列出**实际承诺分发**的模块与只读资产。
py-modules = ["evoguard_cli"]
packages = ["evoguard", "evoguard.enterprise", "evoguard_inspect",
            "evoguard_inspect.loaders", "evoguard_inspect.rules",
            "evoguard_inspect.static", "evoguard.evidence_gate"]
package-dir = { "" = ".", "evoguard" = "ai-service/evoguard", "evoguard_inspect" = "ai-service/evoguard_inspect" }
include-package-data = false

# wheel 内的只读运行资产。安装后落在 sys.prefix/share/evoguardlab/，
# CLI 与 app.py 通过 AGENTLAB_ASSET_ROOT / AGENTLAB_ROOT 找到它们。
# 可变数据（业务库、实验输出）一律不进 wheel，写到用户指定目录或当前目录。
[tool.setuptools.data-files]
"share/evoguardlab/scripts" = ["scripts/defense_demo.py"]
"share/evoguardlab/api" = ["ai-service/api/app.py",
                           "ai-service/api/app_core.py",
                           "ai-service/api/routes_agent.py",
                           "ai-service/api/routes_enterprise.py"]
"share/evoguardlab/frontend" = ["frontend/index.html",
                                "frontend/command.html"]
"share/evoguardlab/config" = ["config/thresholds_v1.json",
                              "config/thresholds_v2_calibrated.json"]
"share/evoguardlab/docs" = ["docs/taxonomy.md"]
"share/evoguardlab/experiments" = ["experiments/metrics.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
