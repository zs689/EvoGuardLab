# EvoGuardLab — 告警规则（参考）
#
# 用到的指标（都来自 ai-service/api/app.py 的接线）：
#   evoguard_requests_total{route}           业务请求数（**不含探针/抓取**）
#   evoguard_probe_requests_total{route}     存活/就绪/抓取等运维探针，单独计数
#   evoguard_audit_failures_total            运行时审计写失败（EG-006）
#   evoguard_rejected_total{decision}        被守卫拒绝的请求
#        decision ∈ missing_or_malformed_token | invalid_token | rate_limited
#                   kill_switch | invalid_tenant | tenant_quota | identity_not_bound
#                   body_too_large
#   evoguard_request_duration_seconds{route} 业务延迟直方图（不含探针）
#
# EG-013：以前 /metrics、/api/health 这些抓取流量也计入业务 SLI，
# 于是「只有 Prometheus 在抓、完全没有业务」会被算成有流量，
# EvoGuardNoTraffic 永远不响。现在探针单独一个 counter，下面的规则
# 只看业务 counter，语义才对得上。
#
# 判定线是**默认值，不是实测值**：本仓库没有生产流量，这些阈值标定的是
# 「会让人半夜起来看一眼」的量级，接真流量后必须重新标定（见 docs/enterprise-readiness.md）。

groups:
  - name: evoguard-availability
    rules:
      - alert: EvoGuardDown
        expr: up{job="evoguard"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "EvoGuard 实例抓不到"
          description: "{{ $labels.instance }} 连续 2 分钟 up=0。先看进程是否退出（启动期 fail-closed 会直接不起）。"

      - alert: EvoGuardNoTraffic
        expr: |
          sum(rate(evoguard_requests_total[10m])) == 0
          and on() (up{job="evoguard"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "实例活着但 10 分钟没有业务流量"
          description: "探针流量不计入本指标（EG-013），所以这里为 0 是真的没有业务请求。先看上游，再看是不是抓错了端口。"

      - alert: EvoGuardProbeScrapeStalled
        expr: sum(rate(evoguard_probe_requests_total[10m])) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "探针计数没有增长，抓取可能断了"
          description: "和 EvoGuardNoTraffic 分开：这条说明连健康检查/Prometheus 抓取都没到，优先查 scrape 凭证与网络。"

      - alert: EvoGuardAuditWriteFailure
        expr: increase(evoguard_audit_failures_total[5m]) > 0
        labels:
          severity: page
        annotations:
          summary: "审计写入失败（成功响应可能已发出）"
          description: "企业模式 /api/ready 会因此变 503。按 request_id 对账，确认没有静默丢失的审计行。"

  - name: evoguard-security
    rules:
      - alert: EvoGuardAuthFailureSpike
        expr: sum(rate(evoguard_rejected_total{decision=~"invalid_token|missing_or_malformed_token"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "鉴权失败速率 > 1/s"
          description: "持续 5 分钟。可能是客户端配错 token，也可能是被扫。先按 request_id 查审计表定位主体。"

      - alert: EvoGuardKillSwitchActive
        expr: increase(evoguard_rejected_total{decision="kill_switch"}[5m]) > 0
        labels:
          severity: page
        annotations:
          summary: "停止开关在拦请求"
          description: "AGENTLAB_KILL_SWITCH 生效意味着写入类请求已被拒。确认是不是演练；不是就是有人在闸门后面。"

      - alert: EvoGuardTenantQuotaExhausted
        expr: sum by (decision) (rate(evoguard_rejected_total{decision="tenant_quota"}[10m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "有租户长期打满配额"
          description: "先确认是业务增长还是单租户在刷；后者要考虑按租户限流而不是全局限流。"

  - name: evoguard-latency
    rules:
      - alert: EvoGuardRejectionRateHigh
        expr: |
          sum(rate(evoguard_rejected_total[5m]))
            / clamp_min(sum(rate(evoguard_requests_total[5m])), 0.001) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "拒绝率 > 20% 持续 10 分钟"
          description: "守卫在拒掉五分之一以上的请求。可能是攻击，也可能是规则太紧把正常流量误伤 —— 两种都要人看。"

      - alert: EvoGuardLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(evoguard_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P95 延迟 > 1s"
          description: "本服务的处理是常数级；超过 1s 基本说明下游（sqlite / 意图模型）在拖。"
