# 两个 evoguard 副本的负载均衡；/api/ready 走每个副本自己的健康检查
upstream evoguard_upstream {
    server evoguard-1:8080;
    server evoguard-2:8080;
    keepalive 16;
}

server {
    listen 80;
    client_max_body_size 2m;

    location / {
        proxy_pass http://evoguard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }
}
