# INT-05：多副本生产拓扑（2 个 evoguard 副本 + Redis + PostgreSQL + Nginx）
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up --build
#   curl -s localhost:18080/api/ready | jq .backends
#
# 本机未验证（无 docker daemon），配置按 compose v3 规范书写，
# 在具备 Docker 的环境里可直接起来；`pg_rls_live.py` 另有独立入口。
x-common: &common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment:
    AGENTLAB_MODE: enterprise
    EVOGUARD_REDIS_URL: redis://redis:6379/0
    EVOGUARD_AUTH_MODE: jwt_hs256
    EVOGUARD_JWT_SECRET: ${EVOGUARD_JWT_SECRET:?需要设置 JWT 密钥}
    EVOGUARD_JWT_ISSUER: https://idp.example
    EVOGUARD_JWT_AUDIENCE: evoguard-api
    AGENTLAB_RATE_LIMIT: "120"
    AGENTLAB_RATE_WINDOW: "60"
    # 企业模式的 fail-closed 校验项：缺一项服务就起不来（这是有意的）
    AGENTLAB_API_TOKEN: ${AGENTLAB_API_TOKEN:-demo-token}
    AGENTLAB_IDENTITY_MAP: '{"demo-token":{"tenant":"t1","actor":"alice","roles":["executor","reader"]}}'
    AGENTLAB_AUDIT_DB: /data/audit.db
    AGENTLAB_DB: /data/app.db
    AGENTLAB_APPROVAL_BACKEND: file:/data/approvals.json
    AGENTLAB_THRESHOLDS: /app/config/thresholds_v1.json
    # 容器内必须绑 0.0.0.0，否则 nginx 连不上（默认 127.0.0.1 是给本机用的）
    AGENTLAB_BIND: 0.0.0.0
  volumes:
    - evodata:/data
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  evoguard-1:
    <<: *common
    container_name: evoguard-1
  evoguard-2:
    <<: *common
    container_name: evoguard-2

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?需要设置数据库密码}
      POSTGRES_DB: evoguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evoguard"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      # RLS 策略在首次初始化时执行（pg_rls.RLS_DDL 的落盘版本）
      - ./init-rls.sql:/docker-entrypoint-initdb.d/10-rls.sql:ro

  nginx:
    image: nginx:alpine
    depends_on:
      - evoguard-1
      - evoguard-2
    ports:
      - "18080:80"   # 8080 常被 cvat 等占用，默认避开
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  evodata:
