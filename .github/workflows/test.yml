name: tests

on:
  push:
  pull_request:

# EG-023：不靠「unittest 绿灯 + 一个自评总分」放行。每个强制检查都有
# 自己的命令、产物与退出码；关键检查没运行到，release-gate 就过不去。
# 自评分数只作回归提示，**不单独作为放行条件**。
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 覆盖 README 声明的 >=3.10 全部主流版本。3.12 曾漏掉——venv 不再
        # 自带 setuptools 的行为正是从 3.12 开始的，必须覆盖。
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show version
        run: python -V
      - name: Install (editable, zero runtime deps + dev static-check tools)
        # 装 dev：不装 pyflakes 的话 EG-024/static-names 会静默 skip，
        # CI 少查一项而输出仍显示全绿。
        run: pip install -e ".[dev]"
      - name: CLI smoke - config
        run: evoguard config
      - name: Defence demo (isolated output)
        run: python scripts/defense_demo.py --out ${{ runner.temp }}/demo_smoke
      - name: Core regression (record counts and skip reasons)
        run: python -m unittest discover -s tests -v 2>&1 | tee unittest.log
        shell: bash
      - name: Eval subset without external corpus
        run: evoguard eval
      - name: Enterprise scorecard (informational, not a release gate)
        run: evoguard scorecard --out scorecard.md
      - name: Objective per-finding gates
        run: python scripts/review_checks.py --gate --out gate_artifacts
      - name: Docker build-context gate (static)
        # 两个脚本都要跑：check_docker_context 验黑名单/运行资产，
        # check_build_context 验 .dockerignore 与 **pyproject 声明是否被
        # COPY 覆盖**（漏拷 evoguard_inspect 那次就是后者抓到的）。
        run: |
          mkdir -p gate_artifacts
          python scripts/check_docker_context.py --out gate_artifacts
          python scripts/check_build_context.py --json gate_artifacts/build_context.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            gate_artifacts/
            unittest.log
            scorecard.md

  clean-clone:
    # 「我这台能跑」不算可复现。这里把仓库 checkout 到一个全新子目录，
    # **不 pip install**、不碰任何本地缓存，只跑标准库路径 —— 验的是
    # 「拿到仓库的人第一步能不能跑起来」。
    # 和上面的 test job 故意分开：那个装了 editable 包，会掩盖
    # sys.path / 打包遗漏的问题。
    # 用 actions/checkout 而不是 `git clone`: 后者在 pull_request 事件下
    # 拉的是 base 分支，测的根本不是这个 PR。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fresh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Show version
        run: python -V
      - name: No build artefacts leaked into the tree
        working-directory: fresh
        run: |
          test ! -d data/external || { echo "data/external 被提交了"; exit 1; }
          test ! -d data/tenants || { echo "data/tenants 被提交了"; exit 1; }
          test ! -d .venv || { echo ".venv 被提交了"; exit 1; }
      - name: Run suite without installing the package
        working-directory: fresh
        run: python -m unittest discover -s tests -q
      - name: CLI works from a bare checkout
        working-directory: fresh
        run: python evoguard_cli.py config
      - name: Objective gates on a bare checkout
        working-directory: fresh
        run: python scripts/review_checks.py --gate --out gate_artifacts
      - name: Scorecard on a bare checkout (informational)
        working-directory: fresh
        run: python evoguard_cli.py scorecard

  wheel-artifact:
    # EG-004 / EG-023：**非 editable**、源码树外、独立 venv、干净 Linux 与
    # Windows 各一份。以前 wheel 装完 config 直接 ModuleNotFoundError，
    # 而 CI 只测 editable，所以一直没发现。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel (no editable install)
        run: python -m pip wheel . --no-deps -w dist
      - name: Create an isolated venv
        shell: bash
        run: python -m venv wheel_venv
      - name: Resolve venv paths
        id: vp
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "py=wheel_venv/Scripts/python.exe" >> "$GITHUB_OUTPUT"
            echo "cli=wheel_venv/Scripts/evoguard.exe" >> "$GITHUB_OUTPUT"
          else
            echo "py=wheel_venv/bin/python" >> "$GITHUB_OUTPUT"
            echo "cli=wheel_venv/bin/evoguard" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the wheel into that venv
        shell: bash
        run: ${{ steps.vp.outputs.py }} -m pip install --no-deps dist/*.whl
      - name: Verify wheel manifest (no missing subpackages or assets)
        shell: bash
        run: python scripts/check_wheel_manifest.py dist/*.whl
      - name: Wheel CLI smoke from an empty directory
        # 传相对路径：Git Bash 的 /d/... 路径 Windows Python 不认，
        # 交给脚本自己用 os.path.abspath 按进程 cwd 解析。
        shell: bash
        run: python scripts/wheel_smoke.py --cli "${{ steps.vp.outputs.cli }}" --workdir wheel_smoke_work --out wheel_gates
      - name: Upload wheel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheel_gates/

  release-gate:
    # 汇总闸门：任一前置 job 没跑完或失败，这个 job 就不会执行。
    # 这样「关键检查被跳过」不可能悄悄变成「发布候选通过」。
    needs: [test, clean-clone, wheel-artifact]
    runs-on: ubuntu-latest
    steps:
      - name: All mandatory checks ran and passed
        run: echo "unittest / objective gates / clean-clone / wheel(Linux+Windows) all passed"


  # PROD-05：真 Postgres/Redis 服务容器上的集成验证。
  # 本机 Docker 已实测过同一套脚本；这里让远端 Runner 也跑一遍，
  # 不把「本机可用」冒充「CI 已绿」。
  integration-pg-redis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evoguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d evoguard"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: evo
      EVOGUARD_REDIS_URL: redis://127.0.0.1:6379/0
      EVOGUARD_PG_DSN: postgresql://evoguard_app:app@127.0.0.1:5432/evoguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Postgres client (psql) for RLS live script
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Bootstrap non-superuser role (superuser bypasses RLS)
        run: |
          psql "postgresql://postgres:evo@127.0.0.1:5432/evoguard" \
            -c "CREATE ROLE evoguard_app LOGIN PASSWORD 'app';" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO evoguard_app;"
      - name: PG RLS live (real DB)
        run: |
          python scripts/pg_rls_live.py \
            --dsn "postgresql://postgres:evo@127.0.0.1:5432/evoguard" \
            --out docs/review-remediation/probes/pg_rls_live.json
      - name: Redis two-process stress
        run: |
          python scripts/distributed_stress.py --url "$EVOGUARD_REDIS_URL" \
            --out docs/review-remediation/probes/distributed_stress.json
      - name: PostgresStore cross-replica E2E (needs pg8000)
        run: |
          # 独立库：pg_rls_live 用 superuser 建了 runs（owner=postgres），
          # pg_store 用普通角色 ALTER 会报 "must be owner of table"
          # （按 CI 顺序本地复现时抓到）。两个 e2e 各用各的库。
          psql "postgresql://postgres:evo@127.0.0.1:5432/postgres" \
            -c "CREATE DATABASE evoguard_store;" \
            -c "\\connect evoguard_store" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO evoguard_app;"
          pip install pg8000
          python scripts/pg_store_e2e.py \
            --dsn "postgresql://evoguard_app:app@127.0.0.1:5432/evoguard_store" \
            --out docs/review-remediation/probes/pg_store_e2e.json
      - name: Upload probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-probes
          path: docs/review-remediation/probes/
